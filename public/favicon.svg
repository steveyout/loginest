<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E05300" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D42" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF6B00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Shield/Rounded Box -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#blueGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#orangeGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Isometric Logistics Cube / Speed Wings -->
  <g transform="translate(256, 256)" filter="url(#dropGlow)">
    <!-- Top Face -->
    <polygon points="0,-120 120,-50 0,20 -120,-50" fill="url(#orangeGrad)" />
    <!-- Left Face -->
    <polygon points="-120,-50 0,20 0,140 -120,70" fill="#0A192F" opacity="0.9" />
    <polygon points="-120,-50 0,20 0,140 -120,70" fill="url(#blueGrad)" opacity="0.6" />
    <!-- Right Face -->
    <polygon points="0,20 120,-50 120,70 0,140" fill="url(#glowGrad)" opacity="0.85" />
    
    <!-- Speed Lines / Arrow Swoosh -->
    <path d="M -160,20 L -90,-20 L -60,0 L -130,40 Z" fill="url(#orangeGrad)" opacity="0.9" />
    <path d="M -180,70 L -120,30 L -90,50 L -150,90 Z" fill="url(#orangeGrad)" opacity="0.6" />
    <path d="M 40,-130 L 150,-130 L 110,-90 L 0,-90 Z" fill="#FFFFFF" opacity="0.25" />
    
    <!-- Center Tech Node Dot -->
    <circle cx="0" cy="-50" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="-50" r="8" fill="#FF5500" />
  </g>
</svg>
